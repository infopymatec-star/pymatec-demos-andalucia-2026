name: Pymatec - captación web L-V 08:37

on:
  schedule:
    - cron: '37 8 * * 1-5'
      timezone: 'Europe/Madrid'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pymatec-free-daily.yml'

concurrency:
  group: pymatec-daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  discover:
    name: Verificar empresas y crear propuestas
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias gratuitas
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2
      - name: Buscar con prioridad Málaga y verificar sin inventar datos
        run: python automation/prospecting_weekdays.py
      - name: Preparar navegador de revisión de escritorio y móvil
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Revisión obligatoria de 3 páginas en 1280px y 390px
        run: python automation/qa_browser.py
      - name: Guardar histórico, propuestas y el informe
        run: |
          git config user.name 'pymatec-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto-demos automation/seen.json automation/reports
          if git diff --cached --quiet; then
            echo 'No hubo cambios.'
          else
            git commit -m "Pymatec prospección verificada $(date -u +%F) [skip ci]"
            git push origin HEAD:main
          fi
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Construir publicación de demos
        run: |
          mkdir -p _site
          unzip -q -o site.zip -d _site
          cp -R auto-demos _site/auto-demos
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar demos revisadas
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  summary:
    name: Verificar enlaces y enviar informe al propietario si hay credenciales
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Resumen solo a correo personal autorizado
        env:
          PYMATEC_GMAIL_ADDRESS: ${{ secrets.PYMATEC_GMAIL_ADDRESS }}
          PYMATEC_GMAIL_APP_PASSWORD: ${{ secrets.PYMATEC_GMAIL_APP_PASSWORD }}
          PYMATEC_REPORT_RECIPIENT: joselss86@hotmail.com
        run: python automation/mail_summary.py

  smoke:
    name: Pruebas de exclusión, verificación de plantilla y resumen sin envíos
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2
      - run: python automation/prospecting_weekdays.py --demo-test
      - run: python automation/mail_summary.py --demo-test
      - name: Instalar navegador de verificación gratuito
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      # Comprobar también las seis imágenes de fondo en ambos tamaños.
      - name: Auditar demo de referencia en escritorio y móvil
        run: python automation/qa_browser.py --demo-test
      # Smoke tests never send emails or publish fictitious proposals.
      # Recheck model email and expanded corporate exclusions after updates.
      # Final: comprobar que incluso las candidatas descartadas se registran para no repetirlas.
      # Validación final antes del primer día laborable programado.
