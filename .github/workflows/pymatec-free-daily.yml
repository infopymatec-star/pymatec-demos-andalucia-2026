name: Pymatec - propuestas diarias gratis

on:
  push:
    paths:
      - '.github/workflows/pymatec-free-daily.yml'
  schedule:
    - cron: '23 9 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pymatec-daily
  cancel-in-progress: false

jobs:
  discover:
    name: Buscar negocios y crear maquetas
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias libres
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2
      - name: Descubrir, verificar y generar demos
        run: python automation/free_daily.py
      - name: Guardar resultados sin repetir empresas
        run: |
          git config user.name 'pymatec-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto-demos automation/seen.json automation/reports
          if git diff --cached --quiet; then
            echo 'No hay cambios.'
          else
            git commit -m "Propuestas diarias Pymatec $(date -u +%F) [skip ci]"
            git push origin HEAD:main
          fi
      - name: Informe privado de envio - GitHub issue publico
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Pymatec: candidatas del $(date -u +%F) (sin enviar)" \
            --body-file automation/issue-body.md || echo 'Consultar informe en automation/reports.'
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar cinco webs iniciales y nuevas
        run: |
          mkdir -p _site
          unzip -q -o site.zip -d _site
          if [ -d auto-demos ]; then cp -R auto-demos _site/auto-demos; fi
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          test -f _site/index.html
      - name: Subir paginas
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    name: Publicar maquetas
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
