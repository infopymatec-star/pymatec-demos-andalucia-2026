name: PRUEBA 1 Pymatec - primer negocio encontrado
on:
  push:
    paths:
      - '.github/workflows/pymatec-test-first.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test_first_company:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias gratuitas
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2
      - name: Verificar estructura nueva de las demos (sin publicar prueba ficticia)
        run: python automation/free_daily.py --demo-test
      - name: Probar generador con primera empresa real
        run: python automation/run_first_sample.py
      - name: Comprobar archivo generado
        run: |
          test -f auto-demos/index.html
          find auto-demos -name 'propuesta-email.txt' | grep bonela
          grep -l 'Bonela Integra S.L.' auto-demos/bonela*/index.html
      - name: Guardar ejemplo y publicar con GitHub Pages
        run: |
          git config user.name 'pymatec-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto-demos automation/reports
          if git diff --cached --quiet; then
            echo 'La propuesta ya estaba generada'
          else
            git commit -m 'Prueba comercial: publicar primera demo Bonela Integra'
            git push origin HEAD:main
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar todas las demos
        run: |
          mkdir -p _site
          unzip -q -o site.zip -d _site
          cp -R auto-demos _site/auto-demos
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          test -f _site/auto-demos/bonela-integra-s-l-62264/index.html
      - name: Crear artefacto Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: test_first_company
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar demo de prueba
        uses: actions/deploy-pages@v4
        id: deployment
