name: Investigación responsive empresas originales Pymatec
on:
  push:
    branches: [main]
    paths:
      - 'automation/audit_originals_oct13.py'
      - '.github/workflows/audit-originals-oct13.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: 'Investigar en dispositivo móvil y escritorio: confirmar fallos reales'
        run: python automation/audit_originals_oct13.py
      - name: Guardar resultados auditables
        run: |
          git config user.name 'pymatec-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/reports/auditoria-originales-2026-10-13.json
          if ! git diff --cached --quiet; then
            git commit -m 'Informe responsive de 29 webs originales - 13 oct 2026 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
