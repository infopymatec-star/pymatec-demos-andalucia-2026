name: Auditoría responsive de diez webs originales
on:
  workflow_dispatch:
  push:
    paths:
      - 'automation/audit_originales_10.py'
      - '.github/workflows/audit-originales-10.yml'
permissions:
  contents: write
concurrency:
  group: audit-originales-10
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Medir páginas originales en dispositivo móvil 390px
        run: python automation/audit_originales_10.py
      - name: Conservar capturas y métricas de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: originales-responsive-10
          path: |
            automation/reports/audit-originales-10.json
            automation/reports/original-*.png
          if-no-files-found: warn
      - name: Registrar informe interno sin publicarlo en las demos
        if: always()
        run: |
          if [ -f automation/reports/audit-originales-10.json ]; then
            git config user.name 'pymatec-qa-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add automation/reports/audit-originales-10.json
            git commit -m "Auditoría objetiva de 10 webs originales [skip ci]" || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
