name: Auditoria movil complementaria tres empresas 2026-10-14
on:
  push:
    paths:
      - '.github/workflows/manual-mobile-audit-20261014.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright Chromium
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Probar diez webs originales sin modificar ni contactar
        run: python automation/manual_mobile_audit_20261014.py
      - name: Guardar resultados JSON y capturas
        if: always()
        run: |
          git config user.name 'pymatec-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/reports/2026-10-14-mobile-audit-part2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Informe de pruebas moviles reales diez empresas [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pantallazos-tres-empresas-20261014
          path: automation/reports/2026-10-14-mobile-shots-part2/
          retention-days: 7
