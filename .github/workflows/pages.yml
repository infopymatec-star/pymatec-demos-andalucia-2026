name: Publicar demos Pymatec (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Descomprimir cinco webs
        run: |
          mkdir -p _site
          unzip -q -o site.zip -d _site
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          test -f _site/index.html
          for slug in laureano-ramos logarze electromesa carpinteria-rahipe oryx-obras; do
            test -f "_site/$slug/index.html"
          done
      - name: Empaquetar páginas
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: deploy
        uses: actions/deploy-pages@v4
